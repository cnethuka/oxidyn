name: build

on:
  push:
  pull_request:

jobs:
  natives:
    name: native (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     platform: linux-x86_64,   target: x86_64-unknown-linux-gnu,  lib: liboxidyn.so,    test: true }
          - { os: ubuntu-22.04-arm, platform: linux-aarch64,  target: aarch64-unknown-linux-gnu, lib: liboxidyn.so,    test: true }
          - { os: windows-2022,     platform: windows-x86_64, target: x86_64-pc-windows-msvc,    lib: oxidyn.dll,      test: true }
          - { os: macos-15,         platform: macos-aarch64,  target: aarch64-apple-darwin,      lib: liboxidyn.dylib, test: true }
          # no more Intel mac runners, cross compile from the arm one
          - { os: macos-15,         platform: macos-x86_64,   target: x86_64-apple-darwin,       lib: liboxidyn.dylib, test: false }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: test
        if: matrix.test
        run: cargo test --release --locked --target ${{ matrix.target }}
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: native/target/${{ matrix.target }}/release/${{ matrix.lib }}
          if-no-files-found: error

  jar:
    needs: natives
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # last one listed becomes JAVA_HOME; Gradle finds the other as a toolchain
          java-version: |
            22
            21
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native/dist
      - name: lay out natives
        run: |
          cd native/dist
          for d in native-*; do mv "$d" "${d#native-}"; done
          find . -type f
      - uses: gradle/actions/setup-gradle@v4
      - name: build and test
        # -PskipCargo: the linux lib comes from the natives job like everything else
        run: ./gradlew build -PskipCargo -Prun_jdk=22 --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: oxidyn-jar
          path: build/libs/*.jar
